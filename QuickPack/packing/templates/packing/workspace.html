t-size:18px;letter-spacing:-.35px;font-weight:750}.row{padding:15px 2px;border-top:1px solid var(--line)}.row:first-of-type{margin-top:8px}.pill{font-weight:750;letter-spacing:.01em}.field{gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:750;color:var(--muted)}.field input,.field textarea,.field select{padding:12px 13px;border-radius:11px;outline:none;transition:.18s}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}button{border-radius:11px;box-shadow:0 4px 10px rgba(91,92,226,.13);transition:transform .15s,filter .15s}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button.ghost{box-shadow:none}.auth{border-radius:22px;padding:30px;box-shadow:var(--shadow)}.auth h1{font-size:28px}.note{border:1px solid var(--line);padding:13px 15px}.delivery{align-items:flex-end;flex-wrap:wrap}.delivery>div{flex:1;min-width:230px}.delivery button{margin-bottom:12px}

n-height:530px;margin:5vh auto;padding:0;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}.auth>h1,.auth>p,.auth>.actions,.auth>form{grid-column:2;margin-left:34px;margin-right:34px}.auth:before{content:"QuickPack\A Fast Delivery, Better Living\A\A Shop  •  Track  •  Get it Delivered";white-space:pre-line;grid-column:1;grid-row:1/5;background:linear-gradient(145deg,#eaf3ff,#dceaff 60%,#f7fbff);color:#1457bd;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:850;line-height:2.1;padding:35px}.auth>h1{margin-top:58px;font-size:28px}.auth>p{margin-top:0}.auth>.actions{margin-bottom:12px}.auth form{margin-bottom:48px}.auth form button{width:100%;padding:13px}.auth .field{margin:7px 0}.auth .field input{padding:12px}.note{border:1px solid var(--line);background:var(--soft);border-radius:12px}

</style></head><body><main class="shell"><style>.switch{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.switch button{padding:8px 14px}.switch button.on{background:var(--accent);color:#fff;border-color:var(--accent)}</style><header class="top"><div><div class="brand">Quick<span>Pack</span></div><div class="muted" id="wsLabel">{{ workspace|title }} workspace</div></div><div class="actions"><div class="switch" id="switch"><button type="button" class="ghost" id="swCustomer">Customer</button><button type="button" class="ghost" id="swWarehouse">Warehouse</button></div><button class="ghost" id="theme">☾ Dark mode</button><button class="ghost" id="logout">Log out</button></div></header>
<section id="auth" class="card auth"><h1>Welcome to QuickPack</h1><p class="muted">Sign in or create your account to continue.</p><div class="actions"><a class="ghost" id="openSignIn" href="/login/" style="padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--ink)">Open Sign in page</a><a id="openSignUp" href="/signup/" style="padding:10px 14px;border-radius:10px;text-decoration:none;background:var(--accent);color:white">Create account</a></div><div class="actions"><button id="showLogin">Login</button><button class="ghost" id="showSignup">Sign up</button></div><form id="authForm">{% csrf_token %}<div class="field" id="nameField"><label>Full name</label><input name="name" placeholder="Your name"></div><div class="field"><label>Email or username</label><input name="username" required></div><div class="field" id="emailField"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><div class="field" id="phoneField"><label>Mobile number</label><input name="phone"></div><div class="field" id="addressField"><label>Delivery address</label><textarea name="address" rows="2"></textarea></div><button type="submit">Continue</button><p id="authMessage" class="muted"></p></form></section>
<section id="app" class="hidden"><div class="layout"><aside class="side" id="nav"></aside><div class="content"><div><h1 id="heading">Dashboard</h1><div class="muted" id="intro">Your QuickPack overview</div></div><div class="grid"><div class="card stat"><span class="muted">Orders</span><strong id="ordersCount">—</strong></div><div class="card stat"><span class="muted" id="lbl2">Wishlist items</span><strong id="wishCount">—</strong></div><div class="card stat"><span class="muted" id="lbl3">Support tickets</span><strong id="ticketCount">—</strong></div></div><div class="card" id="panel"><h2>Dashboard</h2><p class="muted">Choose a section from the navigation.</p></div></div></div></section>
</main><script>
let mode='{{ workspace }}';let activeTab='Overview',lastNotificationId=0,lastWarehouseNoticeId=0,trackingPollTick=0;let signup=false,profile=null,cart=JSON.parse(localStorage.getItem('qp-cart')||'[]');function saveCart(){localStorage.setItem('qp-cart',JSON.stringify(cart))}const $=id=>document.getElementById(id);const csrf=()=>{let m=document.cookie.match(/csrftoken=([^;]+)/);return m?decodeURIComponent(m[1]):''};async function api(url,method='GET',data){let r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),'X-Workspace':mode},body:data?JSON.stringify(data):undefined,credentials:'same-origin'});let d;try{d=await r.json()}catch(e){throw Error('Request failed')}if(!r.ok)throw Error(d.error||'Request failed');return d}
function authMode(v){signup=v;$('nameField').classList.toggle('hidden',!v);$('emailField').classList.toggle('hidden',!v);$('phoneField').classList.toggle('hidden',!v);$('addressField').classList.toggle('hidden',!v);$('authMessage').textContent=v?(mode==='warehouse'?'Create a warehouse account.':'Create a customer account.'):(mode==='warehouse'?'Enter your warehouse login details.':'Enter your customer login details.')} $('showLogin').onclick=()=>authMode(false);$('showSignup').onclick=()=>authMode(true);authMode(false);
$('authForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries());try{let d=await api('/api/auth/'+(signup?'signup/':'login/'),'POST',data);$('authMessage').textContent=d.message;await loadApp()}catch(err){$('authMessage').textContent=err.message}};
$('logout').onclick=async()=>{try{await api('/api/auth/logout/','POST',{})}catch(e){}logged[mode]=false;$('app').classList.add('hidden');$('auth').classList.remove('hidden');applyAuthUI();paintSwitch()};$('theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('qp-theme',t);$('theme').textContent=t==='dark'?'☀ Light mode':'☾ Dark mode'};let saved=localStorage.getItem('qp-theme');if(saved){document.documentElement.dataset.theme=saved;$('theme').textContent=saved==='dark'?'☀ Light mode':'☾ Dark mode'}
const customerNav=['Overview','Shop','Cart','My Orders','Wishlist','Item Requests','Help Center','Notifications','Settings','Payment Settings'];const warehouseNav=['Overview','Pack & Send','Orders & Delivery','Inventory','Item Requests','Messages'];function nav(){$('lbl2').textContent=mode==='warehouse'?'Low-stock products':'Wishlist items';$('lbl3').textContent=mode==='warehouse'?'Open tickets':'Support tickets';let items=mode==='warehouse'?warehouseNav:customerNav;$('nav').innerHTML=items.map((x,i)=>`<button class="${i===0?'active':''}" data-tab="${x}">${x}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.tab)})}
async function loadApp(){let m=mode;try{profile=await api('/api/account/');if(m!==mode)return;if(mode==='warehouse'&&profile.role!=='warehouse'&&!profile.is_staff){throw Error('This account is not a warehouse staff account. Please use a warehouse staff login.')}if(mode==='customer'&&profile.role==='warehouse'){throw Error('This is a warehouse account. Please switch to the Warehouse workspace.')}$('auth').classList.add('hidden');$('app').classList.remove('hidden');logged[mode]=true;paintSwitch();nav();await render('Overview')}catch(e){if(m!==mode)return;logged[mode]=false;paintSwitch();if(e.message!=='Request failed'&&e.message!=='Login required'&&!e.message.includes('401')){$('authMessage').textContent=e.message}}}
async function render(tab){activeTab=tab;$('heading').textContent=tab;$('intro').textContent=mode==='warehouse'?'Warehouse operations and delivery coordination':'Your account, orders and support';let p=$('panel');try{if(tab==='Overview'){let data=mode==='warehouse'?await api('/api/warehouse/dashboard/'):await api('/api/my-orders/');let orders=data.orders||[];$('ordersCount').textContent=orders.length;if(mode==='warehouse'){$('wishCount').textContent=(data.low_stock||[]).length;$('ticketCount').textContent=(data.tickets||[]).filter(t=>t.status!=='resolved').length}if(mode==='warehouse')p.innerHTML='<h2>Warehouse overview</h2>'+orders.map(o=>`<div class="row"><div><b>Order #${o.id}</b><div class="muted">${o.customer||''} · ${o.address||'Address not supplied'}</div></div><span class="pill">${o.status}</span></div>`).join('')||'<p class="muted">No orders yet.</p>';else{let [w,t]=await Promise.all([api('/api/wishlist/'),api('/api/support/')]);$('wishCount').textContent=w.wishlist.length;$('ticketCount').textContent=t.tickets.length;p.innerHTML='<h2>Recent orders</h2>'+orders.map(o=>`<div class="row"><b>Order #${o.id}</b><span class="pill">${o.status}</span></div>`).join('')||'<p class="muted">No orders linked to this account yet.</p>'}}else if(tab==='Shop'){
      let d=await api('/api/products/');
      const shopOrder=['Notebook','Water bottle','Coffee mug','Desk lamp','Backpack','Wireless mouse','Keyboard','Headphones','Phone stand','Tiffin box','Yoga mat','Table fan'];
      d.products.sort((a,b)=>shopOrder.indexOf(a.name)-shopOrder.indexOf(b.name));
      const shopPrices={
        'Notebook':{price:60},
        'Water bottle':{price:179.1,original:199,off:10},
        'Coffee mug':{price:149},
        'Desk lamp':{price:674.25,original:899,off:25},
        'Backpack':{price:1039.2,original:1299,off:20},
        'Wireless mouse':{price:499},
        'Keyboard':{price:849.15,original:999,off:15},
        'Headphones':{price:1399.3,original:1999,off:30},
        'Phone stand':{price:249},
        'Tiffin box':{price:314.1,original:349,off:10},
        'Yoga mat':{price:599},
        'Table fan':{price:1709.05,original:1799,off:5}
      };
      p.innerHTML='<h2>Shop products</h2><p class=muted>Browse available products and add them to your wishlist or order.</p><div class=grid>'+d.products.map(x=>{
        const deal=shopPrices[x.name]||{price:0};
        const priceLine=`<div style="margin:8px 0;font-size:17px;font-weight:700">₹${deal.price}${deal.original?` <span style="font-size:13px;color:#888;text-decoration:line-through;font-weight:400">₹${deal.original}</span> <span style="font-size:12px;color:#16834a;font-weight:700">${deal.off}% OFF</span>`:''}</div>`;
        return `<div class=card>${pimg(x.name,x.image,'100%',140)}<b style="display:block;margin-top:8px">${x.name}</b>${priceLine}<p class=muted>Weight: ${x.weight} kg · ${x.stock<1?'<b>Out of stock</b>':'Stock: '+x.stock}</p><div class=actions><button data-wish="${x.id}" class=ghost>♡ Wishlist</button><button data-cart="${x.id}" ${x.stock<1?'disabled':''}>Add to cart</button></div></div>`;
      }).join('')+'</div>';

;let fd=new FormData();fd.append('image',f);let r=await fetch('/api/products/'+inp.dataset.up+'/image/',{method:'POST',headers:{'X-CSRFToken':csrf(),'X-Workspace':'warehouse'},body:fd,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}if(!r.ok)alert(j.error||'Upload failed');else alert('Photo saved');render('Inventory')});p.querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=async()=>{let fd=new FormData();fd.append('remove','1');await fetch('/api/products/'+b.dataset.rmimg+'/image/',{method:'POST',headers:{'X-CSRFToken':csrf(),'X-Workspace':'warehouse'},body:fd,credentials:'same-origin'});render('Inventory')})}else if(tab==='Messages'){let d=await api('/api/warehouse/dashboard/');p.innerHTML='<h2>Customer messages & help tickets</h2>'+d.tickets.map(t=>`<form class="ticketReply row" data-id="${t.id}"><div><b>#${t.id} · ${eh(t.customer)} · ${eh(t.subject)}</b>${t.order_id?` <span class=pill>Order #${t.order_id}</span>`:''}<p class=muted>${eh(t.message)}</p><small>Status: ${t.status}</small><div class=field><textarea name=reply placeholder="Write a reply to the customer, e.g. Sorry about this, we will fix it" required>${eh(t.reply||'')}</textarea></div><select name=status><option value=in_progress>In progress</option><option value=resolved>Resolved</option></select></div><button>Send reply</button></form>`).join('')||'<p>No customer messages yet.</p>';document.querySelectorAll('.ticketReply').forEach(f=>{let t=d.tickets.find(x=>String(x.id)===f.dataset.id);if(t&&t.status!=='open')f.elements.status.value=t.status});document.querySelectorAll('.ticketReply').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{await api('/api/warehouse/tickets/'+f.dataset.id+'/reply/','POST',Object.fromEntries(new FormData(f)));alert('Reply sent to the customer');render('Messages')}catch(err){alert(err.message)}})}}catch(e){p.innerHTML='<p class="note">'+e.message+'</p>'}}

function quickpackToast(title,message){
  const node=document.createElement('div');node.textContent=title+': '+message;
  Object.assign(node.style,{position:'fixed',right:'18px',bottom:'18px',zIndex:99999,maxWidth:'360px',padding:'13px 16px',background:'#182238',color:'#fff',borderRadius:'12px',boxShadow:'0 8px 30px #0003'});
  document.body.appendChild(node);setTimeout(()=>node.remove(),6500);
  if('Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body:message})}catch(e){}}
}
async function quickpackPoll(){
  if(!$('app')||$('app').classList.contains('hidden'))return;
  try{
    if(mode==='customer'){
      const d=await api('/api/notifications/'),rows=d.notifications||[];
      const newest=rows.reduce((m,n)=>Math.max(m,n.id||0),0);
      if(d.enabled&&lastNotificationId&&newest>lastNotificationId){
        rows.filter(n=>(n.id||0)>lastNotificationId).reverse().forEach(n=>quickpackToast(n.title,n.message));
        if(['Notifications','Help Center'].includes(activeTab))render(activeTab);
      }
      lastNotificationId=Math.max(lastNotificationId,newest);
      trackingPollTick++;
      if(activeTab==='My Orders'&&trackingPollTick%2===0)render('My Orders');
    }else{
      const d=await api('/api/warehouse/dashboard/'),rows=d.notifications||[];
      const newest=rows.reduce((m,n)=>Math.max(m,n.id||0),0);
      if(lastWarehouseNoticeId&&newest>lastWarehouseNoticeId){
        rows.filter(n=>(n.id||0)>lastWarehouseNoticeId).reverse().forEach(n=>quickpackToast(n.title,n.message));
        if(['Overview','Pack & Send','Item Requests','Messages'].includes(activeTab))render(activeTab);
      }
      lastWarehouseNoticeId=Math.max(lastWarehouseNoticeId,newest);
    }
  }catch(e){}
}

<script>
/* Warehouse "Pack & Send": accept -> pick items -> best box (L x W x H + weight) -> pack -> send */
(function(){
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PK={rec:{},choice:{},msg:{},form:{},orders:[],boxes:[]};
const STEPS=['Accept','Pick items','Choose box','Pack','Send'];
const RANK={accepted:0,placed:1,packed:2,out_for_delivery:3};
const allPicked=o=>{const l=o.items.filter(i=>!i.unavailable);return l.length>0&&l.every(i=>i.picked>=i.quantity)};
const dim=b=>`${+b.length} × ${+b.width} × ${+b.height} cm · up to ${b.max_weight} kg`;
async function call(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),'X-Workspace':'warehouse'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  let d={};try{d=await r.json()}catch(e){}return {ok:r.ok,status:r.status,data:d};
}
function stepIndex(o){
  if(o.status==='placed')return 0;
  if(o.status==='accepted')return allPicked(o)?2:1;
  if(o.status==='packed')return 4;
  return 5;
}
function stepBar(o){const k=stepIndex(o);
  return '<div class="pk-steps">'+STEPS.map((t,i)=>`<span class="${i<k?'done':i===k?'now':''}">${i+1}. ${t}</span>`).join('')+'</div>';}
function itemRows(o,editable){
  return o.items.map(i=>{
    if(i.unavailable)return `<div class="pk-line"><span><s>${i.quantity} × ${esc(i.name)}</s><span class="pk-tag">not available</span></span></div>`;
    const done=i.picked>=i.quantity;
    const pick=editable?`<span class="pk-step"><button data-pk="${o.id},${i.id},-1" aria-label="Pick one less">−</button><b>${i.picked} / ${i.quantity}</b><button data-pk="${o.id},${i.id},1" aria-label="Pick one more">+</button></span> <span class="${done?'pk-ok':'muted'}">${done?'✓ picked':''}</span> <button class="ghost" data-un="${o.id},${i.id}">Not available</button>`:`<span class="muted">${i.weight} kg each</span>`;
    return `<div class="pk-line"><span style="display:inline-flex;gap:10px;align-items:center">${pimg(i.name,i.image,'44px',44)}<b>${i.quantity} × ${esc(i.name)}</b>${i.fragile?'<span class="pk-tag">fragile</span>':''}</span><span>${pick}</span></div>`;
  }).join('');
}
function boxPanel(o){
  const r=PK.rec[o.id];
  if(!r||r==='loading')return '<p class="muted">Finding the best box for these items…</p>';
  if(r.status==='no_fit'||r.status==='empty')return `<p class="pk-bad">No box can hold this order. ${esc(r.message||'')}</p>`;
  const rej={};(r.rejected||[]).forEach(x=>rej[x.box]=x.reason);
  const ch=PK.choice[o.id]||[];
  let h=`<div class="pk-rec"><b>Best box: ${esc(r.boxes.map(b=>b.box).join(' + '))}</b><div class="muted">${esc(r.message||'')}</div>`+
    r.boxes.map(b=>`<small>${esc(b.box)} · ${b.fill_percent}% full · items weigh ${b.weight_kg} kg · ₹${b.cost}</small>`).join('<br>')+'</div>';
  if(r.status==='single_box'){
    h+=PK.boxes.map(b=>{const bad=rej[b.name];const best=r.boxes[0].box_id===b.id;
      return `<label class="pk-opt ${bad?'off':''}"><input type="radio" name="box${o.id}" data-box="${o.id},${b.id}" ${bad?'disabled':''} ${ch[0]===b.id?'checked':''}> <b>${esc(b.name)}</b>${best?' <span class="pill">Recommended</span>':''}<span class="muted">${dim(b)} · ₹${b.cost}${bad?' · '+esc(bad):''}</span></label>`}).join('');
  }else h+='<p class="muted">These items do not fit in one box, so the order is split. Pack exactly the boxes above.</p>';
  const names=ch.map(id=>(PK.boxes.find(b=>b.id===id)||{}).name).filter(Boolean).join(' + ');
  return h+`<button data-pack="${o.id}" ${ch.length?'':'disabled'}>Pack order in ${esc(names||'…')}</button>`;
}
function sendPanel(o){
  const f=PK.form[o.id]||{};const d=o.d||{};
  const v=(k,dflt)=>esc(f[k]!=null?f[k]:(dflt||''));
  return `<p class="pk-ok">Packed in ${esc(o.packed_boxes.map(b=>b.box).join(' + '))} · ready to send</p>
  <div class="pk-send"><input data-f="${o.id},delivery_person" placeholder="Delivery person name" value="${v('delivery_person',d.delivery_person)}">
  <input data-f="${o.id},delivery_person_phone" placeholder="Delivery person number" inputmode="tel" value="${v('delivery_person_phone',d.delivery_person_phone)}">
  <input data-f="${o.id},eta_minutes" type="number" min="5" max="480" placeholder="Delivery time (minutes)" value="${v('eta_minutes','30')}"></div>
  <p class="muted">Customer: ${esc(o.customer)}${d.phone?' · '+esc(d.phone):''}<br>Address: ${esc(d.address||'not given')}</p>
  <button data-send="${o.id}">Send order</button>`;
}
function card(o){
  const lbl={placed:'New order',accepted:'Being packed',packed:'Packed',out_for_delivery:'Out for delivery'}[o.status];
  let body='';
  if(o.status==='placed'){
    body=itemRows(o,false)+`<p class="muted">${o.total_weight} kg in total. You can still mark an item “not available” before accepting.</p>`
      +o.items.filter(i=>!i.unavailable).map(i=>`<button class="ghost" data-un="${o.id},${i.id}">${esc(i.name)} not available</button>`).join(' ')
      +`<p><button data-accept="${o.id}">Accept order</button></p>`;
  }else if(o.status==='accepted'){
    body=`<h3>Step 2 · Pick the items from the shelf</h3>`+itemRows(o,true)+`<p><button class="ghost" data-pickall="${o.id}">Pick all</button></p>`;
    if(allPicked(o))body+=`<h3>Step 3 · Choose the box</h3>`+boxPanel(o);
    else body+='<p class="muted">Pick every item to see which box fits best.</p>';
  }else if(o.status==='packed'){
    body=itemRows(o,false)+`<h3>Step 5 · Send the order</h3>`+sendPanel(o);
  }else{
    const d=o.d||{};
    body=itemRows(o,false)+`<p class="pk-ok">On the way with ${esc(d.delivery_person||'delivery person')} ${esc(d.delivery_person_phone||'')}</p><button data-deliver="${o.id}">Mark as delivered</button>`;
  }
  return `<div class="pk-card" data-order="${o.id}"><div class="pk-head"><b>Order #${o.id} · ${esc(o.customer)}</b><span><span class="pill">${lbl}</span> ${o.status!=='out_for_delivery'?`<button class="ghost" data-wcancel="${o.id}">Delete order</button>`:''}</span></div>${stepBar(o)}${body}<p class="${PK.msg[o.id]&&PK.msg[o.id].err?'pk-bad':'pk-ok'}">${esc(PK.msg[o.id]?PK.msg[o.id].t:'')}</p></div>`;
}
function paint(){
  const p=$('panel');
  p.innerHTML='<div class="pk-head"><h2>Orders to pack and send</h2><button class="ghost" data-refresh="1">Refresh</button></div><p class="muted">Follow the steps on each order: accept it, pick the items, choose the box, pack it and send it.</p>'
    +(PK.orders.map(card).join('')||'<p class="muted">No open orders right now.</p>');
}
async function ensureRec(o){
  if(o.status!=='accepted'||!allPicked(o)||PK.rec[o.id])return;
  PK.rec[o.id]='loading';
  const r=await call('POST',`/api/orders/${o.id}/recommend-box/`);
  PK.rec[o.id]=r.data;
  PK.choice[o.id]=(r.data.boxes||[]).map(b=>b.box_id);
  paint();
}
window.renderPack=async function(){
  const p=$('panel');
  const [ol,dash,bx]=await Promise.all([call('GET','/api/orders/?status=placed,accepted,packed,out_for_delivery'),call('GET','/api/warehouse/dashboard/'),call('GET','/api/boxes/')]);
  if(!dash.ok){p.innerHTML=`<p class="pk-bad">${esc(dash.data.error||'Could not load orders')}</p>`;return}
  const info={};(dash.data.orders||[]).forEach(o=>info[o.id]=o);
  PK.boxes=(bx.data.boxes||[]);
  PK.orders=(ol.data.orders||[]).map(o=>({...o,d:info[o.id]||{}})).sort((a,b)=>RANK[a.status]-RANK[b.status]||b.id-a.id);
  paint();
  PK.orders.forEach(ensureRec);
};
async function act(id,method,url,body,okText){
  const r=await call(method,url,body);
  PK.msg[id]=r.ok?{t:okText||''}:{t:r.data.error||'Something went wrong',err:true};
  await window.renderPack();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t||!$('panel').contains(t))return;const d=t.dataset;
  if(d.refresh){PK.rec={};await window.renderPack();return}
  if(d.accept){await act(d.accept,'POST',`/api/orders/${d.accept}/accept/`,null,'Order accepted. Now pick the items.');return}
  if(d.pk){const [o,i,dl]=d.pk.split(',').map(Number);const it=PK.orders.find(x=>x.id===o).items.find(x=>x.id===i);
    await act(o,'POST',`/api/orders/${o}/items/${i}/pick/`,{picked:Math.max(0,Math.min(it.quantity,it.picked+dl))});return}
  if(d.pickall){const od=PK.orders.find(x=>x.id==d.pickall);
    for(const it of od.items)if(!it.unavailable&&it.picked<it.quantity)await call('POST',`/api/orders/${od.id}/items/${it.id}/pick/`,{picked:it.quantity});
    PK.msg[od.id]={t:''};await window.renderPack();return}
  if(d.un){const [o,i]=d.un.split(',').map(Number);
    if(!confirm('Mark this item as not available? The customer will see it removed and its stock is set to 0.'))return;
    delete PK.rec[o];await act(o,'POST',`/api/orders/${o}/items/${i}/unavailable/`,null,'Item removed from the order.');return}
  if(d.pack){const o=+d.pack;await act(o,'POST',`/api/orders/${o}/pack/`,{box_ids:PK.choice[o]||[]},'Packed. Now send it with a delivery person.');return}
  if(d.send){const o=+d.send;const f=PK.form[o]||{};const od=PK.orders.find(x=>x.id===o)||{d:{}};
    await act(o,'POST',`/api/warehouse/orders/${o}/send/`,{delivery_person:f.delivery_person!=null?f.delivery_person:od.d.delivery_person,delivery_person_phone:f.delivery_person_phone!=null?f.delivery_person_phone:od.d.delivery_person_phone,eta_minutes:f.eta_minutes||30},'Order sent. The customer can now see the delivery person and time.');return}
  if(d.wcancel){const o=+d.wcancel;if(!confirm('Delete order #'+o+'? An order that is not yet sent is cancelled first: items go back to stock and the customer is told.'))return;
    const r=await call('POST',`/api/warehouse/orders/${o}/delete/`,{});if(!r.ok)alert(r.data.error||'Could not delete');else alert('Order #'+o+' deleted');await window.renderPack();return}
  if(d.deliver){const o=+d.deliver;await act(o,'POST',`/api/warehouse/orders/${o}/deliver/`,null,'Marked as delivered.');return}
});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!$('panel').contains(t))return;
  if(t.dataset.box){const [o,b]=t.dataset.box.split(',').map(Number);PK.choice[o]=[b];paint()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f){const [o,k]=t.dataset.f.split(',');(PK.form[o]=PK.form[o]||{})[k]=t.value}});
})();
</script>



<script>
/* Item requests: customer asks for something not in the shop, warehouse answers (available / back in 1-2 days / not available) */
const eh=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RQ_LABEL={pending:'Under review',available:'Available',temporarily_unavailable:'Temporarily unavailable',not_available:'Not available'};
const RQ_CLASS={pending:'muted',available:'pk-ok',temporarily_unavailable:'',not_available:'pk-bad'};
async function renderMyRequests(){
  const p=$('panel');const d=await api('/api/my-requests/');
  p.innerHTML='<h2>Request an item that is not in the shop</h2><p class="muted">Cannot find what you need (for example a table)? Tell the warehouse. They will check and reply here.</p>'+
   '<form id="rqForm"><div class="field"><label>Item name</label><input name="name" required placeholder="e.g. Study table"></div><div class="field"><label>How many</label><input name="quantity" type="number" min="1" value="1"></div><div class="field"><label>Note (optional)</label><input name="note" placeholder="size, colour, anything useful"></div><button>Send request</button></form>'+
   '<h2 style="margin-top:22px">My requests</h2>'+
   (d.requests.map(r=>`<div class="row"><div><b>${eh(r.name)} × ${r.quantity}</b><div class="${RQ_CLASS[r.status]}" style="font-weight:600">${eh(r.reply)}</div></div><span class="pill">${RQ_LABEL[r.status]}</span></div>`).join('')||'<p class="muted">No requests yet.</p>');
  $('rqForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.quantity=+f.quantity||1;
    try{await api('/api/requests/place/','POST',f);renderMyRequests()}catch(err){alert(err.message)}};
}
async function renderWhRequests(){
  const p=$('panel');const d=await api('/api/warehouse/dashboard/');const rs=d.item_requests||[];
  const open=rs.filter(r=>r.status==='pending'||r.status==='temporarily_unavailable'),done=rs.filter(r=>!open.includes(r));
  p.innerHTML='<h2>Item requests from customers</h2><p class="muted">Check each request and answer it. The customer gets your reply as a notification and in their Item Requests tab.</p>'+
   (open.map(r=>`<form class="rqRev pk-card" data-id="${r.id}"><div class="pk-head"><b>${eh(r.name)} × ${r.quantity} · ${eh(r.customer)}</b><span class="pill">${RQ_LABEL[r.status]}${r.restock_days?' · '+r.restock_days+' day'+(r.restock_days>1?'s':''):''}</span></div>${r.note?`<p class="muted">${eh(r.note)}</p>`:''}
   <div class="pk-send"><input name="length" type="number" step="any" min="0" placeholder="Length cm"><input name="width" type="number" step="any" min="0" placeholder="Width cm"><input name="height" type="number" step="any" min="0" placeholder="Height cm"><input name="weight" type="number" step="any" min="0" placeholder="Weight kg"><input name="stock" type="number" min="0" placeholder="Stock" value="${r.quantity}"></div>
   <label><input type="checkbox" name="fragile"> Fragile</label>
   <div class="actions" style="margin:10px 0"><button type="button" data-dec="available">Available · add to shop</button></div>
   <div class="actions" style="margin:10px 0"><select name="restock_days"><option value="1">Back in 1 day</option><option value="2" selected>Back in 2 days</option></select><button type="button" class="ghost" data-dec="temporarily_unavailable">Temporarily unavailable</button></div>
   <div class="actions" style="margin:10px 0"><input name="reason" placeholder="Reason (optional)" style="flex:1;min-width:160px;padding:9px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)"><button type="button" class="ghost" data-dec="not_available">Not available</button></div><p class="pk-bad" data-err></p></form>`).join('')||'<p class="muted">No open requests.</p>')+
   (done.length?'<h2 style="margin-top:22px">Answered</h2>'+done.map(r=>`<div class="row"><div><b>${eh(r.name)} × ${r.quantity} · ${eh(r.customer)}</b><div class="muted">${eh(r.reply)}</div></div><span class="pill">${RQ_LABEL[r.status]}</span></div>`).join(''):'');
  p.querySelectorAll('.rqRev [data-dec]').forEach(b=>b.onclick=async()=>{
    const f=b.closest('form'),v=n=>f.elements[n].value,dec=b.dataset.dec,body={decision:dec};
    if(dec==='available'){['length','width','height','weight','stock'].forEach(k=>body[k]=v(k));body.fragile=f.elements.fragile.checked}
    if(dec==='temporarily_unavailable')body.restock_days=+v('restock_days');
    if(dec==='not_available')body.reason=v('reason');
    try{await api('/api/requests/'+f.dataset.id+'/review/','POST',body);renderWhRequests()}catch(err){f.querySelector('[data-err]').textContent=err.message}});
}
</script>
<script>
/* Product pictures: the uploaded photo, or a picture tile when there is none yet */
const PIC=[['earphone','🎧'],['headphone','🎧'],['notebook','📓'],['book','📘'],['bottle','🥤'],['mug','☕'],['lamp','💡'],['backpack','🎒'],['bag','🎒'],['mouse','🖱️'],['keyboard','⌨️'],['dumbbell','🏋️'],['vase','🏺'],['case','📱'],['stand','📱'],['pencil','✏️'],['pen','🖊️'],['chocolate','🍫'],['tiffin','🍱'],['yoga','🧘'],['fan','🌀'],['table','🪑'],['chair','🪑']];
function pimg(name,img,w,h){
  if(img)return `<img src="${eh(img)}" alt="${eh(name)}" loading="lazy" style="width:${w};height:${h}px;object-fit:cover;border-radius:12px;display:block;flex:none">`;
  const n=String(name||'').toLowerCase();const e=(PIC.find(k=>n.includes(k[0]))||[0,'📦'])[1];let hue=0;for(const c of n)hue=(hue*31+c.charCodeAt(0))%360;
  return `<div role="img" aria-label="${eh(name)}" style="width:${w};height:${h}px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:${Math.round(h*.5)}px;background:hsl(${hue} 70% 92%)">${e}</div>`}
</script>
